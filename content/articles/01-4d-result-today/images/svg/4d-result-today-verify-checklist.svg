<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="704" viewBox="0 0 1200 704"><rect width="1200" height="704" fill="#F5F7FB"/><rect x="0" y="0" width="1200" height="128" fill="#0B1E3A"/><rect x="0" y="123" width="1200" height="5" fill="#F5B301"/><text x="48" y="62" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="start">Verify First, Celebrate Second</text><rect x="977.2" y="46" width="174.8" height="30" rx="15" fill="#F5B301"/><text x="1064.6" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1E3A" text-anchor="middle" letter-spacing="1.5">BEFORE YOU CLAIM</text><g transform="translate(0,164)"><rect x="48" y="8" width="1104" height="394" rx="18" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/><rect x="48" y="8" width="10" height="394" rx="5" fill="#F5B301"/><text x="96" y="56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0B1E3A" text-anchor="start">Five checks on every winning ticket</text><rect x="96" y="83" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="100" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Confirm the draw date and time on the ticket match the result board.</text><rect x="96" y="131" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="148" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Match all four digits in exact order (or any order for a permutation bet).</text><rect x="96" y="179" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="196" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Cross-check the number on the official operator site, not just one source.</text><rect x="96" y="227" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="244" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Sign the back of the ticket and keep it somewhere safe. It is a bearer document.</text><rect x="96" y="275" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="292" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Bring IC and the original ticket to claim. Large prizes are paid at operator</text><text x="126" y="322" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">headquarters.</text></g><rect x="48" y="590" width="1104" height="44" rx="10" fill="#EEF2F9" stroke="#DDE3EC"/><circle cx="74" cy="612" r="9" fill="#16365F"/><text x="74" y="617" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">i</text><text x="94" y="617" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5B6472">Never publish a photo of an unclaimed winning ticket.</text>
