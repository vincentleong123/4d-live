<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="742" viewBox="0 0 1200 742"><rect width="1200" height="742" fill="#F5F7FB"/><rect x="0" y="0" width="1200" height="128" fill="#0B1E3A"/><rect x="0" y="123" width="1200" height="5" fill="#F5B301"/><text x="48" y="62" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="start">Special Draw Days Explained</text><rect x="1005.1" y="46" width="146.9" height="30" rx="15" fill="#F5B301"/><text x="1078.55" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1E3A" text-anchor="middle" letter-spacing="1.5">SPECIAL DRAWS</text><g transform="translate(0,164)"><rect x="48" y="8" width="1104" height="488" rx="18" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/><rect x="48" y="8" width="10" height="488" rx="5" fill="#F5B301"/><text x="96" y="56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0B1E3A" text-anchor="start">What to know about non-standard draw dates</text><rect x="96" y="83" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="100" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Operators can add extra draw days when the authorities approve them.</text><rect x="96" y="131" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="148" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">They cluster around Chinese New Year, Deepavali, Hari Raya and year-end holidays.</text><rect x="96" y="179" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="196" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Announcements come from the operators themselves, days or weeks ahead.</text><rect x="96" y="227" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="244" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">The result archive is the fastest proof: if a board exists for that date, it was a real</text><text x="126" y="274" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">draw.</text><rect x="96" y="305" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="322" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Your ticket must show the exact draw date. A special draw is a separate draw, not a bonus</text><text x="126" y="352" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">round.</text><rect x="84" y="426" width="1036" height="52" rx="12" fill="#FFF6E0" stroke="#F2D48A"/><text x="104" y="460" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#7A5A00" text-anchor="start">If a site claims a bonus draw that no operator announced, treat it as suspect.</text></g>
  <line x1="48" y1="742-44" x2="1152" y2="742-44" stroke="#DDE3EC" stroke-width="1"/>
  <text x="48" y="742-18" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6472" font-weight="700">4DMALAYA.COM</text>
  <text x="1152" y="742-18" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6472" text-anchor="end">4D results, schedules and guides</text></svg>