<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="682" viewBox="0 0 1200 682"><rect width="1200" height="682" fill="#F5F7FB"/><rect x="0" y="0" width="1200" height="128" fill="#0B1E3A"/><rect x="0" y="123" width="1200" height="5" fill="#F5B301"/><text x="48" y="62" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="start">The Draw Evening Timeline</text><rect x="1033" y="46" width="119" height="30" rx="15" fill="#F5B301"/><text x="1092.5" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1E3A" text-anchor="middle" letter-spacing="1.5">DRAW NIGHT</text><g transform="translate(0,164)"><line x1="78" y1="62" x2="78" y2="130" stroke="#DDE3EC" stroke-width="4"/><circle cx="78" cy="30" r="30" fill="#F5B301"/><text x="78" y="41" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">1</text><text x="136" y="36" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Sales close</text><text x="136" y="72" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Bets for that draw stop being accepted shortly before the draw. Ask your outlet for its exact</text><text x="136" y="100" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">cut-off.</text><line x1="78" y1="162" x2="78" y2="226" stroke="#DDE3EC" stroke-width="4"/><circle cx="78" cy="130" r="30" fill="#F5B301"/><text x="78" y="141" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">2</text><text x="136" y="136" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Draw at 7:00 PM MYT</text><text x="136" y="172" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">The winning 23 numbers are drawn and announced by the operator.</text><line x1="78" y1="258" x2="78" y2="322" stroke="#DDE3EC" stroke-width="4"/><circle cx="78" cy="226" r="30" fill="#F5B301"/><text x="78" y="237" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">3</text><text x="136" y="232" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Board published</text><text x="136" y="268" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">The official result board goes up within minutes on the operator site and app.</text><circle cx="78" cy="322" r="30" fill="#F5B301"/><text x="78" y="333" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">4</text><text x="136" y="328" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Results updated everywhere</text><text x="136" y="364" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Aggregators refresh all boards the same evening, usually within minutes of the operator.</text></g><rect x="48" y="568" width="1104" height="44" rx="10" fill="#EEF2F9" stroke="#DDE3EC"/><circle cx="74" cy="590" r="9" fill="#16365F"/><text x="74" y="595" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">i</text><text x="94" y="595" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5B6472">Times are a guide, not a guarantee. Read the timestamp beside the result you are viewing.</text>
