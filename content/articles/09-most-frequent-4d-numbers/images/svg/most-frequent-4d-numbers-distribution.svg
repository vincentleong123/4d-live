nt-size="22" font-weight="700" fill="#101828" text-anchor="start">Wins twice (2 times)</text><rect x="402" y="178" width="570" height="46" rx="23" fill="#E7ECF4"/><rect x="402" y="178" width="10" height="46" rx="23" fill="#1E4577"/><text x="428" y="209" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0B1E3A">45 numbers</text><text x="48" y="276" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#101828" text-anchor="start">Wins three times</text><rect x="402" y="250" width="570" height="46" rx="23" fill="#E7ECF4"/><rect x="402" y="250" width="10" height="46" rx="23" fill="#3C6EA5"/><text x="428" y="281" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0B1E3A">1 number</text></g><rect x="48" y="546" width="1104" height="44" rx="10" fill="#EEF2F9" stroke="#DDE3EC"/><circle cx="74" cy="568" r="9" fill="#16365F"/><text x="74" y="573" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">i</text><text x="94" y="573" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5B6472">Theoretical distribution using a 1-in-10,000 chance per draw. Real archives behave the same way.</text>
