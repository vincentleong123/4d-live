<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="813.5" viewBox="0 0 1200 813.5"><rect width="1200" height="813.5" fill="#F5F7FB"/><rect x="0" y="0" width="1200" height="128" fill="#0B1E3A"/><rect x="0" y="123" width="1200" height="5" fill="#F5B301"/><text x="48" y="62" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="start">What Frequency Data Really Says</text><rect x="1014.4" y="46" width="137.60000000000002" height="30" rx="15" fill="#F5B301"/><text x="1083.2" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1E3A" text-anchor="middle" letter-spacing="1.5">MYTH VS FACT</text><g transform="translate(0,164)"><rect x="48" y="0" width="490.66666666666663" height="56" fill="#0B1E3A"/><text x="64" y="35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#F5B301" text-anchor="start">Common claim</text><rect x="538.6666666666666" y="0" width="613.3333333333334" height="56" fill="#16365F"/><text x="554.6666666666666" y="35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#F5B301" text-anchor="start">The reality</text><rect x="48" y="56" width="1104" height="92.7" fill="#FFFFFF"/><text x="64" y="90" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#101828" text-anchor="start">7788 is overdue, it must hit soon</text><text x="554.6666666666666" y="90" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Every draw is independent. The number has the same</text><text x="554.6666666666666" y="118.35" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">odds as always.</text><line x1="538.6666666666666" y1="56" x2="538.6666666666666" y2="148.7" stroke="#DDE3EC"/><line x1="48" y1="148.7" x2="1152" y2="148.7" stroke="#DDE3EC"/><rect x="48" y="148.7" width="1104" height="92.7" fill="#F0F3F9"/><text x="64" y="182.7" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#101828" text-anchor="start">Hot numbers are luckier</text><text x="554.6666666666666" y="182.7" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Short-run frequency evens out. Long-run results match</text><text x="554.6666666666666" y="211.04999999999998" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">the theoretical average.</text><line x1="538.6666666666666" y1="148.7" x2="538.6666666666666" y2="241.39999999999998" stroke="#DDE3EC"/><line x1="48" y1="241.39999999999998" x2="1152" y2="241.39999999999998" stroke="#DDE3EC"/><rect x="48" y="241.39999999999998" width="1104" height="92.7" fill="#FFFFFF"/><text x="64" y="275.4" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#101828" text-anchor="start">Avoid cold numbers</text><text x="554.6666666666666" y="275.4" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Cold numbers carry exactly the same 1-in-10,000</text><text x="554.6666666666666" y="303.75" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">chance.</text><line x1="538.6666666666666" y1="241.39999999999998" x2="538.6666666666666" y2="334.09999999999997" stroke="#DDE3EC"/><line x1="48" y1="334.09999999999997" x2="1152" y2="334.09999999999997" stroke="#DDE3EC"/><rect x="48" y="334.09999999999997" width="1104" height="92.7" fill="#F0F3F9"/><text x="64" y="368.09999999999997" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#101828" text-anchor="start">Patterns reveal future draws</text><text x="554.6666666666666" y="368.09999999999997" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Draws are random mechanical events. No pattern</text><text x="554.6666666666666" y="396.45" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">carries forward.</text><line x1="538.6666666666666" y1="334.09999999999997" x2="538.6666666666666" y2="426.79999999999995" stroke="#DDE3EC"/><line x1="48" y1="426.79999999999995" x2="1152" y2="426.79999999999995" stroke="#DDE3EC"/><rect x="48" y="426.79999999999995" width="1104" height="92.7" fill="#FFFFFF"/><text x="64" y="460.79999999999995" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#101828" text-anchor="start">A tracking app improves your odds</text><text x="554.6666666666666" y="460.79999999999995" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">It cannot. The odds are fixed by the total</text><text x="554.6666666666666" y="489.15" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">combination count.</text><line x1="538.6666666666666" y1="426.79999999999995" x2="538.6666666666666" y2="519.5" stroke="#DDE3EC"/><line x1="48" y1="519.5" x2="1152" y2="519.5" stroke="#DDE3EC"/><rect x="48" y="0" width="1104" height="519.5" fill="none" stroke="#DDE3EC" stroke-width="2"/></g><rect x="48" y="699.5" width="1104" height="44" rx="10" fill="#EEF2F9" stroke="#DDE3EC"/><circle cx="74" cy="721.5" r="9" fill="#16365F"/><text x="74" y="726.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">i</text><text x="94" y="726.5" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5B6472">Statistics describe the past. They do not move the probability of the next draw.</text>
