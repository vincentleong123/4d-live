<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="682" viewBox="0 0 1200 682"><rect width="1200" height="682" fill="#F5F7FB"/><rect x="0" y="0" width="1200" height="128" fill="#0B1E3A"/><rect x="0" y="123" width="1200" height="5" fill="#F5B301"/><text x="48" y="62" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="start">If You Play, Read This</text><rect x="1033" y="46" width="119" height="30" rx="15" fill="#F5B301"/><text x="1092.5" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1E3A" text-anchor="middle" letter-spacing="1.5">DISCLAIMER</text><g transform="translate(0,164)"><rect x="48" y="8" width="1104" height="428" rx="18" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/><rect x="48" y="8" width="10" height="428" rx="5" fill="#F5B301"/><text x="96" y="56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0B1E3A" text-anchor="start">Statistics are descriptive, not predictive</text><rect x="96" y="83" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="100" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">No number is due. No number is hot. The draw does not remember.</text><rect x="96" y="131" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="148" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Frequency analysis can describe history and nothing more.</text><rect x="96" y="179" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="196" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Never increase your stake because a list looks promising.</text><rect x="96" y="227" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="244" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Fix a budget per draw and treat any loss as the cost of entertainment.</text><rect x="96" y="275" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="292" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Lottery play is for adults aged 21 and above only.</text><rect x="84" y="366" width="1036" height="52" rx="12" fill="#FFF6E0" stroke="#F2D48A"/><text x="104" y="400" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#7A5A00" text-anchor="start">Gambling can be addictive. If betting is affecting your life, stop and seek help.</text></g>
