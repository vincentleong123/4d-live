<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><rect width="1200" height="690" fill="#F5F7FB"/><rect x="0" y="0" width="1200" height="128" fill="#0B1E3A"/><rect x="0" y="123" width="1200" height="5" fill="#F5B301"/><text x="48" y="62" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="start">Build Your Own Frequency List</text><rect x="1070.2" y="46" width="81.80000000000001" height="30" rx="15" fill="#F5B301"/><text x="1111.1" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1E3A" text-anchor="middle" letter-spacing="1.5">METHOD</text><g transform="translate(0,164)"><line x1="78" y1="62" x2="78" y2="130" stroke="#DDE3EC" stroke-width="4"/><circle cx="78" cy="30" r="30" fill="#F5B301"/><text x="78" y="41" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">1</text><text x="136" y="36" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Collect official results</text><text x="136" y="72" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Pull the full board from each operator for the period you want to analyse. Never mix</text><text x="136" y="100" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">operators.</text><line x1="78" y1="162" x2="78" y2="230" stroke="#DDE3EC" stroke-width="4"/><circle cx="78" cy="130" r="30" fill="#F5B301"/><text x="78" y="141" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">2</text><text x="136" y="136" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Count each number</text><text x="136" y="172" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Tally how often every 4-digit number appears, split by prize tier rather than lumped</text><text x="136" y="200" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">together.</text><line x1="78" y1="262" x2="78" y2="326" stroke="#DDE3EC" stroke-width="4"/><circle cx="78" cy="230" r="30" fill="#F5B301"/><text x="78" y="241" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">3</text><text x="136" y="236" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Compare with the expected average</text><text x="136" y="272" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Over 1,000 draws each number should win 1st prize about 0.1 times. Deviation is normal.</text><circle cx="78" cy="326" r="30" fill="#F5B301"/><text x="78" y="337" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">4</text><text x="136" y="332" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Report it honestly</text><text x="136" y="368" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Label the sample size and date range. A short window produces dramatic but meaningless</text><text x="136" y="396" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">swings.</text></g><rect x="48" y="576" width="1104" height="44" rx="10" fill="#EEF2F9" stroke="#DDE3EC"/><circle cx="74" cy="598" r="9" fill="#16365F"/><text x="74" y="603" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">i</text><text x="94" y="603" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5B6472">This is a fun data exercise. It is not a prediction tool and should never drive your stakes.</text>
  <line x1="48" y1="690-44" x2="1152" y2="690-44" stroke="#DDE3EC" stroke-width="1"/>
  <text x="48" y="690-18" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6472" font-weight="700">4DMALAYA.COM</text>
  <text x="1152" y="690-18" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6472" text-anchor="end">4D results, schedules and guides</text></svg>