<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="678" viewBox="0 0 1200 678"><rect width="1200" height="678" fill="#F5F7FB"/><rect x="0" y="0" width="1200" height="128" fill="#0B1E3A"/><rect x="0" y="123" width="1200" height="5" fill="#F5B301"/><text x="48" y="62" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="start">Permutation Bet on 1234</text><rect x="1060.9" y="46" width="91.1" height="30" rx="15" fill="#F5B301"/><text x="1106.45" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1E3A" text-anchor="middle" letter-spacing="1.5">EXAMPLE</text><g transform="translate(0,164)"><line x1="78" y1="62" x2="78" y2="126" stroke="#DDE3EC" stroke-width="4"/><circle cx="78" cy="30" r="30" fill="#F5B301"/><text x="78" y="41" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">1</text><text x="136" y="36" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">You pick 1234 as Perm 24</text><text x="136" y="72" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">The slip records a permutation of 24 with a RM1 base, so the total cost is RM24.</text><line x1="78" y1="158" x2="78" y2="222" stroke="#DDE3EC" stroke-width="4"/><circle cx="78" cy="126" r="30" fill="#F5B301"/><text x="78" y="137" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">2</text><text x="136" y="132" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">All 24 digit orders are covered</text><text x="136" y="168" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">1234, 1243, 1324, 3214, 4321 and every other arrangement count as yours.</text><line x1="78" y1="254" x2="78" y2="318" stroke="#DDE3EC" stroke-width="4"/><circle cx="78" cy="222" r="30" fill="#F5B301"/><text x="78" y="233" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">3</text><text x="136" y="228" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Any matching order wins</text><text x="136" y="264" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">If the draw shows 4321, a straight bet would miss. A permutation pays out.</text><circle cx="78" cy="318" r="30" fill="#F5B301"/><text x="78" y="329" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">4</text><text x="136" y="324" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Payout per combination is lower</text><text x="136" y="360" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">The stake is spread across 24 combinations, so each pays a fraction of the fixed-bet prize.</text></g><rect x="48" y="564" width="1104" height="44" rx="10" fill="#EEF2F9" stroke="#DDE3EC"/><circle cx="74" cy="586" r="9" fill="#16365F"/><text x="74" y="591" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">i</text><text x="94" y="591" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5B6472">Fewer unique digits means fewer permutations: 1123 gives 12, 1122 gives 6, 1112 gives 4.</text>
  <line x1="48" y1="678-44" x2="1152" y2="678-44" stroke="#DDE3EC" stroke-width="1"/>
  <text x="48" y="678-18" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6472" font-weight="700">4DMALAYA.COM</text>
  <text x="1152" y="678-18" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6472" text-anchor="end">4D results, schedules and guides</text></svg>