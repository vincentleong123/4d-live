<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#F5F7FB"/><rect x="0" y="0" width="1200" height="128" fill="#0B1E3A"/><rect x="0" y="123" width="1200" height="5" fill="#F5B301"/><text x="48" y="62" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="start">Using History Data Honestly</text><rect x="1005.1" y="46" width="146.9" height="30" rx="15" fill="#F5B301"/><text x="1078.55" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1E3A" text-anchor="middle" letter-spacing="1.5">REALITY CHECK</text><g transform="translate(0,164)"><rect x="48" y="8" width="1104" height="364" rx="18" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/><rect x="48" y="8" width="10" height="364" rx="5" fill="#F5B301"/><text x="96" y="56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0B1E3A" text-anchor="start">Archive data is a record, not a forecast</text><rect x="96" y="83" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="100" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Past draws show what happened. They do not change the odds of the next draw.</text><rect x="96" y="131" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="148" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">No number is due or overdue. Every draw is independent.</text><rect x="96" y="179" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="196" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Use history to verify an old ticket or satisfy curiosity, not to build a system.</text><rect x="96" y="227" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="244" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Frequency lists describe the past only. The next draw starts from zero.</text><rect x="96" y="275" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="292" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Track your own spending alongside results if you play regularly.</text></g><rect x="48" y="560" width="1104" height="44" rx="10" fill="#EEF2F9" stroke="#DDE3EC"/><circle cx="74" cy="582" r="9" fill="#16365F"/><text x="74" y="587" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">i</text><text x="94" y="587" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5B6472">Lottery draws are random. Treat the game as entertainment, not income.</text>
  <line x1="48" y1="675-44" x2="1152" y2="675-44" stroke="#DDE3EC" stroke-width="1"/>
  <text x="48" y="675-18" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6472" font-weight="700">4DMALAYA.COM</text>
  <text x="1152" y="675-18" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6472" text-anchor="end">4D results, schedules and guides</text></svg>