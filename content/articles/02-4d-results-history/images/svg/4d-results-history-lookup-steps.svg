<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#F5F7FB"/><rect x="0" y="0" width="1200" height="128" fill="#0B1E3A"/><rect x="0" y="123" width="1200" height="5" fill="#F5B301"/><text x="48" y="62" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="start">Find Any Past Result in 3 Moves</text><rect x="1070.2" y="46" width="81.80000000000001" height="30" rx="15" fill="#F5B301"/><text x="1111.1" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1E3A" text-anchor="middle" letter-spacing="1.5">LOOKUP</text><g transform="translate(0,164)"><line x1="78" y1="62" x2="78" y2="126" stroke="#DDE3EC" stroke-width="4"/><circle cx="78" cy="30" r="30" fill="#F5B301"/><text x="78" y="41" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">1</text><text x="136" y="36" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Choose operator and game</text><text x="136" y="72" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Filter by Magnum, Sports Toto or Da Ma Cai first. The same date has three different boards.</text><line x1="78" y1="158" x2="78" y2="226" stroke="#DDE3EC" stroke-width="4"/><circle cx="78" cy="126" r="30" fill="#F5B301"/><text x="78" y="137" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">2</text><text x="136" y="132" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Jump to the draw date</text><text x="136" y="168" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Draws fall on Wednesday, Saturday and Sunday, so scroll to the week you need or use the date</text><text x="136" y="196" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">picker.</text><circle cx="78" cy="226" r="30" fill="#F5B301"/><text x="78" y="237" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">3</text><text x="136" y="232" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Read the full 23-number board</text><text x="136" y="268" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Top three prizes plus 10 special and 10 consolation numbers, all listed for that draw.</text></g><rect x="48" y="472" width="1104" height="44" rx="10" fill="#EEF2F9" stroke="#DDE3EC"/><circle cx="74" cy="494" r="9" fill="#16365F"/><text x="74" y="499" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">i</text><text x="94" y="499" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5B6472">Use the draw date printed on your ticket, not the date you bought it.</text>
