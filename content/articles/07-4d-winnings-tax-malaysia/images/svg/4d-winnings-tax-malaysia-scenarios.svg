<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720.8" viewBox="0 0 1200 720.8"><rect width="1200" height="720.8" fill="#F5F7FB"/><rect x="0" y="0" width="1200" height="128" fill="#0B1E3A"/><rect x="0" y="123" width="1200" height="5" fill="#F5B301"/><text x="48" y="62" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="start">Tax Treatment by Situation</text><rect x="1042.3" y="46" width="109.7" height="30" rx="15" fill="#F5B301"/><text x="1097.15" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1E3A" text-anchor="middle" letter-spacing="1.5">SCENARIOS</text><g transform="translate(0,164)"><rect x="48" y="0" width="331.2" height="56" fill="#0B1E3A"/><text x="64" y="35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#F5B301" text-anchor="start">Situation</text><rect x="379.2" y="0" width="375.35999999999996" height="56" fill="#16365F"/><text x="395.2" y="35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#F5B301" text-anchor="start">General treatment</text><rect x="754.56" y="0" width="397.44" height="56" fill="#16365F"/><text x="770.56" y="35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#F5B301" text-anchor="start">What you should do</text><rect x="48" y="56" width="1104" height="92.7" fill="#FFFFFF"/><text x="64" y="90" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#101828" text-anchor="start">Occasional win on a RM10</text><text x="64" y="118.35" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#101828" text-anchor="start">bet</text><text x="395.2" y="90" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Windfall. Not taxed as income</text><text x="395.2" y="118.35" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">for most players</text><line x1="379.2" y1="56" x2="379.2" y2="148.7" stroke="#DDE3EC"/><text x="770.56" y="90" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Keep the ticket photo and claim</text><text x="770.56" y="118.35" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">record</text><line x1="754.56" y1="56" x2="754.56" y2="148.7" stroke="#DDE3EC"/><line x1="48" y1="148.7" x2="1152" y2="148.7" stroke="#DDE3EC"/><rect x="48" y="148.7" width="1104" height="92.7" fill="#F0F3F9"/><text x="64" y="182.7" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#101828" text-anchor="start">Large one-off win</text><text x="395.2" y="182.7" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Generally not taxed, but</text><text x="395.2" y="211.04999999999998" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">document everything</text><line x1="379.2" y1="148.7" x2="379.2" y2="241.39999999999998" stroke="#DDE3EC"/><text x="770.56" y="182.7" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Keep IC copy, ticket and HQ claim</text><text x="770.56" y="211.04999999999998" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">receipt</text><line x1="754.56" y1="148.7" x2="754.56" y2="241.39999999999998" stroke="#DDE3EC"/><line x1="48" y1="241.39999999999998" x2="1152" y2="241.39999999999998" stroke="#DDE3EC"/><rect x="48" y="241.39999999999998" width="1104" height="92.7" fill="#FFFFFF"/><text x="64" y="275.4" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#101828" text-anchor="start">Betting every draw as a</text><text x="64" y="303.75" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#101828" text-anchor="start">habit</text><text x="395.2" y="275.4" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">May be seen as a trade if</text><text x="395.2" y="303.75" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">systematic and profit-led</text><line x1="379.2" y1="241.39999999999998" x2="379.2" y2="334.09999999999997" stroke="#DDE3EC"/><text x="770.56" y="275.4" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Ask a tax agent before it becomes</text><text x="770.56" y="303.75" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">an issue</text><line x1="754.56" y1="241.39999999999998" x2="754.56" y2="334.09999999999997" stroke="#DDE3EC"/><line x1="48" y1="334.09999999999997" x2="1152" y2="334.09999999999997" stroke="#DDE3EC"/><rect x="48" y="334.09999999999997" width="1104" height="92.7" fill="#F0F3F9"/><text x="64" y="368.09999999999997" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#101828" text-anchor="start">Running bets for others</text><text x="395.2" y="368.09999999999997" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Trading income, plus legal risk</text><text x="395.2" y="396.45" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">if unlicensed</text><line x1="379.2" y1="334.09999999999997" x2="379.2" y2="426.79999999999995" stroke="#DDE3EC"/><text x="770.56" y="368.09999999999997" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Stop. Unlicensed bookmaking is</text><text x="770.56" y="396.45" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">illegal</text><line x1="754.56" y1="334.09999999999997" x2="754.56" y2="426.79999999999995" stroke="#DDE3EC"/><line x1="48" y1="426.79999999999995" x2="1152" y2="426.79999999999995" stroke="#DDE3EC"/><rect x="48" y="0" width="1104" height="426.79999999999995" fill="none" stroke="#DDE3EC" stroke-width="2"/></g><rect x="48" y="606.8" width="1104" height="44" rx="10" fill="#EEF2F9" stroke="#DDE3EC"/><circle cx="74" cy="628.8" r="9" fill="#16365F"/><text x="74" y="633.8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">i</text><text x="94" y="633.8" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5B6472">Rules and interpretations can change. Get professional advice for your own circumstances.</text>
