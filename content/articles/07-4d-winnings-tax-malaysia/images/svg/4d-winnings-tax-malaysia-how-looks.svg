<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="694" viewBox="0 0 1200 694"><rect width="1200" height="694" fill="#F5F7FB"/><rect x="0" y="0" width="1200" height="128" fill="#0B1E3A"/><rect x="0" y="123" width="1200" height="5" fill="#F5B301"/><text x="48" y="62" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="start">How Gambling Winnings Are Treated</text><rect x="1051.6" y="46" width="100.4" height="30" rx="15" fill="#F5B301"/><text x="1101.8" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1E3A" text-anchor="middle" letter-spacing="1.5">POSITION</text><g transform="translate(0,164)"><line x1="78" y1="62" x2="78" y2="130" stroke="#DDE3EC" stroke-width="4"/><circle cx="78" cy="30" r="30" fill="#F5B301"/><text x="78" y="41" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">1</text><text x="136" y="36" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Casual win is not employment income</text><text x="136" y="72" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">A one-off lottery prize is a windfall. It is not salary, so it is not taxed as such for most</text><text x="136" y="100" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">players.</text><line x1="78" y1="162" x2="78" y2="230" stroke="#DDE3EC" stroke-width="4"/><circle cx="78" cy="130" r="30" fill="#F5B301"/><text x="78" y="141" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">2</text><text x="136" y="136" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Frequency changes the picture</text><text x="136" y="172" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">If betting becomes systematic, regular and profit-driven, LHDN may view it as a trade or</text><text x="136" y="200" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">business.</text><line x1="78" y1="262" x2="78" y2="330" stroke="#DDE3EC" stroke-width="4"/><circle cx="78" cy="230" r="30" fill="#F5B301"/><text x="78" y="241" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">3</text><text x="136" y="236" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Records decide disputes</text><text x="136" y="272" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Tickets, dates, stakes and claim receipts are what you show if your pattern of play is ever</text><text x="136" y="300" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">questioned.</text><circle cx="78" cy="330" r="30" fill="#F5B301"/><text x="78" y="341" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">4</text><text x="136" y="336" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Business income must be declared</text><text x="136" y="372" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">If your activity is treated as a trade, the profit is taxable and losses may not be claimable</text><text x="136" y="400" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">against other income.</text></g><rect x="48" y="580" width="1104" height="44" rx="10" fill="#EEF2F9" stroke="#DDE3EC"/><circle cx="74" cy="602" r="9" fill="#16365F"/><text x="74" y="607" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">i</text><text x="94" y="607" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5B6472">General information only, not tax advice. Confirm your position with LHDN or a licensed tax agent.</text>
