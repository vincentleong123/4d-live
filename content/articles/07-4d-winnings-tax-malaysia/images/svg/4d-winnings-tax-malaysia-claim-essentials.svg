<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="785.15" viewBox="0 0 1200 785.15"><rect width="1200" height="785.15" fill="#F5F7FB"/><rect x="0" y="0" width="1200" height="128" fill="#0B1E3A"/><rect x="0" y="123" width="1200" height="5" fill="#F5B301"/><text x="48" y="62" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="start">Prize Claim Essentials</text><rect x="1051.6" y="46" width="100.4" height="30" rx="15" fill="#F5B301"/><text x="1101.8" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1E3A" text-anchor="middle" letter-spacing="1.5">CLAIMING</text><g transform="translate(0,164)"><rect x="48" y="0" width="394.2857142857143" height="56" fill="#0B1E3A"/><text x="64" y="35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#F5B301" text-anchor="start">Item</text><rect x="442.2857142857143" y="0" width="709.7142857142858" height="56" fill="#16365F"/><text x="458.2857142857143" y="35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#F5B301" text-anchor="start">Why it matters</text><rect x="48" y="56" width="1104" height="92.7" fill="#FFFFFF"/><text x="64" y="90" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#101828" text-anchor="start">Original winning ticket</text><text x="458.2857142857143" y="90" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">It is a bearer document. Anyone holding it can claim, so sign</text><text x="458.2857142857143" y="118.35" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">the back.</text><line x1="442.2857142857143" y1="56" x2="442.2857142857143" y2="148.7" stroke="#DDE3EC"/><line x1="48" y1="148.7" x2="1152" y2="148.7" stroke="#DDE3EC"/><rect x="48" y="148.7" width="1104" height="92.7" fill="#F0F3F9"/><text x="64" y="182.7" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#101828" text-anchor="start">MyKad (IC)</text><text x="458.2857142857143" y="182.7" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Identity must match the claimant. Prizes are paid to the</text><text x="458.2857142857143" y="211.04999999999998" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">presenter of a valid ticket.</text><line x1="442.2857142857143" y1="148.7" x2="442.2857142857143" y2="241.39999999999998" stroke="#DDE3EC"/><line x1="48" y1="241.39999999999998" x2="1152" y2="241.39999999999998" stroke="#DDE3EC"/><rect x="48" y="241.39999999999998" width="1104" height="64.35" fill="#FFFFFF"/><text x="64" y="275.4" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#101828" text-anchor="start">Draw date and result check</text><text x="458.2857142857143" y="275.4" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Confirms the ticket is for the right draw before you travel.</text><line x1="442.2857142857143" y1="241.39999999999998" x2="442.2857142857143" y2="305.75" stroke="#DDE3EC"/><line x1="48" y1="305.75" x2="1152" y2="305.75" stroke="#DDE3EC"/><rect x="48" y="305.75" width="1104" height="92.7" fill="#F0F3F9"/><text x="64" y="339.75" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#101828" text-anchor="start">Outlets have cash limits</text><text x="458.2857142857143" y="339.75" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Small prizes are paid over the counter. Big wins go to</text><text x="458.2857142857143" y="368.1" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">operator headquarters.</text><line x1="442.2857142857143" y1="305.75" x2="442.2857142857143" y2="398.45" stroke="#DDE3EC"/><line x1="48" y1="398.45" x2="1152" y2="398.45" stroke="#DDE3EC"/><rect x="48" y="398.45" width="1104" height="92.7" fill="#FFFFFF"/><text x="64" y="432.45" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#101828" text-anchor="start">Keep the receipt</text><text x="458.2857142857143" y="432.45" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Your proof of claim and your record if tax treatment is ever</text><text x="458.2857142857143" y="460.8" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">queried.</text><line x1="442.2857142857143" y1="398.45" x2="442.2857142857143" y2="491.15" stroke="#DDE3EC"/><line x1="48" y1="491.15" x2="1152" y2="491.15" stroke="#DDE3EC"/><rect x="48" y="0" width="1104" height="491.15" fill="none" stroke="#DDE3EC" stroke-width="2"/></g><rect x="48" y="671.15" width="1104" height="44" rx="10" fill="#EEF2F9" stroke="#DDE3EC"/><circle cx="74" cy="693.15" r="9" fill="#16365F"/><text x="74" y="698.15" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">i</text><text x="94" y="698.15" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5B6472">Claim windows and thresholds differ by operator. Check the operator prize claim rules first.</text>
  <line x1="48" y1="785.15-44" x2="1152" y2="785.15-44" stroke="#DDE3EC" stroke-width="1"/>
  <text x="48" y="785.15-18" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6472" font-weight="700">4DMALAYA.COM</text>
  <text x="1152" y="785.15-18" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6472" text-anchor="end">4D results, schedules and guides</text></svg>