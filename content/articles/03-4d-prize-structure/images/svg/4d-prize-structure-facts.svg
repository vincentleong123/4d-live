<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730"><rect width="1200" height="730" fill="#F5F7FB"/><rect x="0" y="0" width="1200" height="128" fill="#0B1E3A"/><rect x="0" y="123" width="1200" height="5" fill="#F5B301"/><text x="48" y="62" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="start">Prize Structure Facts to Remember</text><rect x="1042.3" y="46" width="109.7" height="30" rx="15" fill="#F5B301"/><text x="1097.15" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1E3A" text-anchor="middle" letter-spacing="1.5">KEY FACTS</text><g transform="translate(0,164)"><rect x="48" y="8" width="1104" height="476" rx="18" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/><rect x="48" y="8" width="10" height="476" rx="5" fill="#F5B301"/><text x="96" y="56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0B1E3A" text-anchor="start">Six things that decide what you win</text><rect x="96" y="83" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="100" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Every draw publishes 23 winning numbers: 3 top prizes, 10 special, 10 consolation.</text><rect x="96" y="131" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="148" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">A Big bet can win on any of the 23. A Small bet can win only on the top 3.</text><rect x="96" y="179" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="196" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Small pays 40 percent more on 1st prize. The trade-off is zero coverage below 3rd.</text><rect x="96" y="227" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="244" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Payouts are linear: RM10 wins ten times the listed figure.</text><rect x="96" y="275" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="292" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Permutation and iBet entries pay less per combination because the cost is spread.</text><rect x="96" y="323" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="340" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">All three national pools use the same core prize table.</text><rect x="84" y="414" width="1036" height="52" rx="12" fill="#FFF6E0" stroke="#F2D48A"/><text x="104" y="448" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#7A5A00" text-anchor="start">Always confirm against the operator published prize table before claiming.</text></g>
