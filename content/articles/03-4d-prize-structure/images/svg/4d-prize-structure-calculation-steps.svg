<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><rect width="1200" height="690" fill="#F5F7FB"/><rect x="0" y="0" width="1200" height="128" fill="#0B1E3A"/><rect x="0" y="123" width="1200" height="5" fill="#F5B301"/><text x="48" y="62" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="start">How Your 4D Payout Is Worked Out</text><rect x="1042.3" y="46" width="109.7" height="30" rx="15" fill="#F5B301"/><text x="1097.15" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1E3A" text-anchor="middle" letter-spacing="1.5">CALCULATE</text><g transform="translate(0,164)"><line x1="78" y1="62" x2="78" y2="130" stroke="#DDE3EC" stroke-width="4"/><circle cx="78" cy="30" r="30" fill="#F5B301"/><text x="78" y="41" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">1</text><text x="136" y="36" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Check your bet type</text><text x="136" y="72" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Big covers all 23 winning numbers. Small pays more on the top three but nothing on special or</text><text x="136" y="100" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">consolation.</text><line x1="78" y1="162" x2="78" y2="230" stroke="#DDE3EC" stroke-width="4"/><circle cx="78" cy="130" r="30" fill="#F5B301"/><text x="78" y="141" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">2</text><text x="136" y="136" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Match the digits in order</text><text x="136" y="172" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">The number must land in the same order you played, unless you bought a permutation or iBet</text><text x="136" y="200" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">entry.</text><line x1="78" y1="262" x2="78" y2="326" stroke="#DDE3EC" stroke-width="4"/><circle cx="78" cy="230" r="30" fill="#F5B301"/><text x="78" y="241" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">3</text><text x="136" y="236" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Multiply by your stake</text><text x="136" y="272" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Per-RM1 payout times your stake. A RM5 Big hit on 1st prize pays 5 x RM2,500 = RM12,500.</text><circle cx="78" cy="326" r="30" fill="#F5B301"/><text x="78" y="337" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">4</text><text x="136" y="332" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Claim with the original ticket</text><text x="136" y="368" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Keep the ticket pristine. Outlet cash limits apply, and big wins are settled at operator</text><text x="136" y="396" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">headquarters.</text></g><rect x="48" y="576" width="1104" height="44" rx="10" fill="#EEF2F9" stroke="#DDE3EC"/><circle cx="74" cy="598" r="9" fill="#16365F"/><text x="74" y="603" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">i</text><text x="94" y="603" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5B6472">Check your slip: it prints the bet type, draw date and stake.</text>
