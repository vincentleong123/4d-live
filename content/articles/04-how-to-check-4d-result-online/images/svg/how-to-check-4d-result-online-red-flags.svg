<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730"><rect width="1200" height="730" fill="#F5F7FB"/><rect x="0" y="0" width="1200" height="128" fill="#0B1E3A"/><rect x="0" y="123" width="1200" height="5" fill="#F5B301"/><text x="48" y="62" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="start">Red Flags on Result Sites</text><rect x="1070.2" y="46" width="81.80000000000001" height="30" rx="15" fill="#F5B301"/><text x="1111.1" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1E3A" text-anchor="middle" letter-spacing="1.5">SAFETY</text><g transform="translate(0,164)"><rect x="48" y="8" width="1104" height="476" rx="18" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/><rect x="48" y="8" width="10" height="476" rx="5" fill="#F5B301"/><text x="96" y="56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0B1E3A" text-anchor="start">Six signs a result site is not safe</text><rect x="96" y="83" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="100" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">No draw date or timestamp on the numbers shown.</text><rect x="96" y="131" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="148" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">It asks you to log in, pay or deposit just to view results.</text><rect x="96" y="179" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="196" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Popups pushing gambling apps or foreign betting operators.</text><rect x="96" y="227" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="244" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Links to unlicensed bookies, agents or Telegram betting groups.</text><rect x="96" y="275" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="292" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Typosquat domains that mimic an operator official spelling.</text><rect x="96" y="323" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="340" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">It requests your IC, bank details or OTP. No result site ever needs these.</text><rect x="84" y="414" width="1036" height="52" rx="12" fill="#FFF6E0" stroke="#F2D48A"/><text x="104" y="448" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#7A5A00" text-anchor="start">Viewing results is always free. If a site asks for money or data, close it.</text></g>
  <line x1="48" y1="730-44" x2="1152" y2="730-44" stroke="#DDE3EC" stroke-width="1"/>
  <text x="48" y="730-18" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6472" font-weight="700">4DMALAYA.COM</text>
  <text x="1152" y="730-18" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6472" text-anchor="end">4D results, schedules and guides</text></svg>