<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#F5F7FB"/><rect x="0" y="0" width="1200" height="128" fill="#0B1E3A"/><rect x="0" y="123" width="1200" height="5" fill="#F5B301"/><text x="48" y="62" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="start">Draw Night Result Flow</text><rect x="1051.6" y="46" width="100.4" height="30" rx="15" fill="#F5B301"/><text x="1101.8" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1E3A" text-anchor="middle" letter-spacing="1.5">TIMELINE</text><g transform="translate(0,164)"><rect x="48" y="0" width="209.6" height="250" rx="16" fill="#0B1E3A"/><rect x="48" y="0" width="209.6" height="6" rx="3" fill="#F5B301"/><circle cx="152.8" cy="56" r="26" fill="#F5B301"/><text x="152.8" y="66" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0B1E3A" text-anchor="middle">1</text><text x="152.8" y="106" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#F5B301" text-anchor="middle">Sales close</text><text x="152.8" y="145" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#C3D2E6" text-anchor="middle">Bet sales stop</text><text x="152.8" y="168" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#C3D2E6" text-anchor="middle">shortly before the</text><text x="152.8" y="191" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#C3D2E6" text-anchor="middle">7pm draw. Check</text><text x="152.8" y="214" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#C3D2E6" text-anchor="middle">with your outlet.</text><polygon points="257.6,112 271.6,120 257.6,128" fill="#F5B301"/><rect x="271.6" y="0" width="209.6" height="250" rx="16" fill="#16365F"/><rect x="271.6" y="0" width="209.6" height="6" r