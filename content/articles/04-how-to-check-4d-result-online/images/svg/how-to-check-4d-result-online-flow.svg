 y="191" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#C3D2E6" text-anchor="middle">board within</text><text x="600" y="214" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#C3D2E6" text-anchor="middle">minutes.</text><polygon points="704.8,112 718.8,120 704.8,128" fill="#F5B301"/><rect x="718.8" y="0" width="209.6" height="250" rx="16" fill="#16365F"/><rect x="718.8" y="0" width="209.6" height="6" rx="3" fill="#F5B301"/><circle cx="823.5999999999999" cy="56" r="26" fill="#F5B301"/><text x="823.5999999999999" y="66" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0B1E3A" text-anchor="middle">4</text><text x="823.5999999999999" y="106" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#F5B301" text-anchor="middle">Aggregators</text><text x="823.5999999999999" y="133" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#F5B301" text-anchor="middle">update</text><text x="823.5999999999999" y="172" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#C3D2E6" text-anchor="middle">Results sites</text><text x="823.5999999999999" y="195" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#C3D2E6" text-anchor="middle">refresh across all</text><text x="823.5999999999999" y="218" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#C3D2E6" text-anchor="middle">operators the same</text><text x="823.5999999999999" y="241" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#C3D2E6" text-anchor="middle">evening.</text><polygon points="928.4,112 942.4,120 928.4,128" fill="#F5B301"/><rect x="942.4" y="0" width="209.6" height="250" rx="16" fill="#0B1E3A"/><rect x="942.4" y="0" width="209.6" height="6" rx="3" fill="#F5B301"/><circle cx="1047.2" cy="56" r="26" fill="#F5B301"/><text x="1047.2" y="66" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0B1E3A" text-anchor="middle">5</text><text x="1047.2" y="106" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#F5B301" text-anchor="middle">Verify ticket</text><text x="1047.2" y="145" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#C3D2E6" text-anchor="middle">Match the draw date</text><text x="1047.2" y="168" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#C3D2E6" text-anchor="middle">and all four</text><text x="1047.2" y="191" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#C3D2E6" text-anchor="middle">digits, then keep</text><text x="1047.2" y="214" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#C3D2E6" text-anchor="middle">the ticket safe.</text></g><rect x="48" y="440" width="1104" height="44" rx="10" fill="#EEF2F9" stroke="#DDE3EC"/><circle cx="74" cy="462" r="9" fill="#16365F"/><text x="74" y="467" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">i</text><text x="94" y="467" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5B6472">Publication can run a few minutes either side of 7pm. Refresh once before worrying.</text>
