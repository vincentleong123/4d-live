<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="682" viewBox="0 0 1200 682"><rect width="1200" height="682" fill="#F5F7FB"/><rect x="0" y="0" width="1200" height="128" fill="#0B1E3A"/><rect x="0" y="123" width="1200" height="5" fill="#F5B301"/><text x="48" y="62" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="start">Four Rules That Never Change</text><rect x="1042.3" y="46" width="109.7" height="30" rx="15" fill="#F5B301"/><text x="1097.15" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1E3A" text-anchor="middle" letter-spacing="1.5">THE RULES</text><g transform="translate(0,164)"><line x1="78" y1="62" x2="78" y2="126" stroke="#DDE3EC" stroke-width="4"/><circle cx="78" cy="30" r="30" fill="#F5B301"/><text x="78" y="41" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">1</text><text x="136" y="36" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">There are exactly 10,000 combinations</text><text x="136" y="72" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">From 0000 to 9999. Your number occupies one slot out of ten thousand, every single draw.</text><line x1="78" y1="158" x2="78" y2="222" stroke="#DDE3EC" stroke-width="4"/><circle cx="78" cy="126" r="30" fill="#F5B301"/><text x="78" y="137" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">2</text><text x="136" y="132" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Each draw is independent</text><text x="136" y="168" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">The machine has no memory. Last week result has zero influence on this week draw.</text><line x1="78" y1="254" x2="78" y2="318" stroke="#DDE3EC" stroke-width="4"/><circle cx="78" cy="222" r="30" fill="#F5B301"/><text x="78" y="233" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">3</text><text x="136" y="228" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">The odds do not drift</text><text x="136" y="264" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">A number drawn ten times this month still has the same 1-in-10,000 chance next draw.</text><circle cx="78" cy="318" r="30" fill="#F5B301"/><text x="78" y="329" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1E3A" text-anchor="middle">4</text><text x="136" y="324" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">The payout sets the edge</text><text x="136" y="360" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">Operators price the prize table so they keep about 35 to 36 percent of all stakes,</text><text x="136" y="388" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5B6472" text-anchor="start">statistically.</text></g><rect x="48" y="568" width="1104" height="44" rx="10" fill="#EEF2F9" stroke="#DDE3EC"/><circle cx="74" cy="590" r="9" fill="#16365F"/><text x="74" y="595" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">i</text><text x="94" y="595" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5B6472">Systems, apps and prediction formulas change nothing about these four rules.</text>
  <line x1="48" y1="682-44" x2="1152" y2="682-44" stroke="#DDE3EC" stroke-width="1"/>
  <text x="48" y="682-18" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6472" font-weight="700">4DMALAYA.COM</text>
  <text x="1152" y="682-18" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6472" text-anchor="end">4D results, schedules and guides</text></svg>