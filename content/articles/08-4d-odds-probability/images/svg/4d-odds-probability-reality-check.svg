<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="682" viewBox="0 0 1200 682"><rect width="1200" height="682" fill="#F5F7FB"/><rect x="0" y="0" width="1200" height="128" fill="#0B1E3A"/><rect x="0" y="123" width="1200" height="5" fill="#F5B301"/><text x="48" y="62" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="start">The Honest Summary</text><rect x="1005.1" y="46" width="146.9" height="30" rx="15" fill="#F5B301"/><text x="1078.55" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1E3A" text-anchor="middle" letter-spacing="1.5">REALITY CHECK</text><g transform="translate(0,164)"><rect x="48" y="8" width="1104" height="428" rx="18" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/><rect x="48" y="8" width="10" height="428" rx="5" fill="#F5B301"/><text x="96" y="56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0B1E3A" text-anchor="start">What the numbers actually say</text><rect x="96" y="83" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="100" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">RM1 staked returns about 64 to 65 sen on average. Entertainment, not investment.</text><rect x="96" y="131" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="148" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">A Big bet wins something roughly 1 time in 435 draws on that number.</text><rect x="96" y="179" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="196" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Hitting 1st prize is 1 in 10,000 per number, per draw.</text><rect x="96" y="227" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="244" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">No wheeling system, app or hot-number list shifts those odds.</text><rect x="96" y="275" width="14" height="14" rx="3" fill="#F5B301"/><text x="126" y="292" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#101828" text-anchor="start">Fixed budget, fixed stakes, no chasing losses.</text><rect x="84" y="366" width="1036" height="52" rx="12" fill="#FFF6E0" stroke="#F2D48A"/><text x="104" y="400" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#7A5A00" text-anchor="start">Gambling is entertainment with a cost. 21 and above. Play responsibly.</text></g>
