<script>
/* contact form submission */
(function(){
  var f = document.querySelector('.tp-form');
  if (!f) return;
  f.addEventListener('submit', function(e){
    e.preventDefault();
    var out = document.getElementById('cOut');
    if (out) out.textContent = '...';
    var fd = new FormData(f);
    var body = {};
    fd.forEach(function(v,k){ body[k]=v; });
    fetch('/api/contact', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body)})
      .then(function(r){ return r.json(); })
      .then(function(j){
        out.textContent = j.ok ? (j.msg || 'Terima kasih! Mesej anda telah dihantar. Kami akan balas.')
                               : (j.error || 'Maaf, mesej gagal dihantar. Cuba lagi.');
        if (j.ok) f.reset();
      })
      .catch(function(){ out.textContent = 'Maaf, mesej gagal dihantar. Cuba lagi nanti.'; });
  });
})();
</script>
