<div class="main container page">
  <h2>📜 Draw Date</h2>
  <p class="sub">Winning numbers for one draw date — 1st, 2nd and 3rd prize, special and consolation numbers for every 4D operator.</p>
</div>
<script>
/* progressive enhancement only: the numbers above are already in the HTML */
(function () {
  var m = location.pathname.match(/\/results\/(\d{4}-\d{2}-\d{2})/);
  if (!m) return;
  fetch('/api/date?date=' + m[1])
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.ok) return;
      var s = document.querySelector('.nav-status .src');
      if (s) s.textContent = j.operatorCount + ' operators';
    })
    .catch(function () {});
})();
</script>
